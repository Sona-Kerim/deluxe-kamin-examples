<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana səhifə — 3 variant</title>
<style>
  :root {
    --sys: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    --wine: #7a1e22;
    --wine-h: #941f25;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sys); -webkit-font-smoothing: antialiased; background: #fff; color: #1d1d1f; }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }

  /* seçim paneli */
  .picker { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; background: rgba(250, 250, 250, .9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 1px 0 rgba(0,0,0,.06); flex-wrap: wrap; }
  .picker span { font-size: 13px; color: #6e6e73; margin-right: 8px; }
  .picker button { font: 500 14px var(--sys); border: 0; cursor: pointer; padding: 9px 18px; border-radius: 980px; background: #e8e8ed; color: #1d1d1f; transition: background .2s, color .2s; }
  .picker button.on { background: #1d1d1f; color: #fff; }
  .note { max-width: 980px; margin: 0 auto; padding: 22px 20px 6px; text-align: center; font-size: 15px; color: #6e6e73; line-height: 1.5; }
  .note b { color: #1d1d1f; }

  .variant { display: none; }
  .variant.on { display: block; }

  /* ümumi: Apple tipli plitələr */
  .nav { height: 48px; display: flex; align-items: center; justify-content: center; gap: 30px; font-size: 13px; }
  .nav img { height: 24px; }
  .nav a { opacity: .85; }
  .tile { position: relative; overflow: hidden; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .tile h2 { margin: 0; font-weight: 600; letter-spacing: -.015em; line-height: 1.07; }
  .tile p { margin: 8px 0 0; font-weight: 400; letter-spacing: .005em; line-height: 1.2; }
  .ctas { display: flex; gap: 14px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .b { font-size: 17px; padding: 11px 22px; border-radius: 980px; transition: background .2s, color .2s; }
  .b1 { background: var(--wine); color: #fff; }
  .b1:hover { background: var(--wine-h); }
  .b2 { box-shadow: inset 0 0 0 1px var(--wine); color: var(--wine); }
  .b2:hover { background: var(--wine); color: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
  .stack { display: grid; gap: 12px; padding: 12px 12px 0; }
  .foot { padding: 40px 20px 60px; text-align: center; font-size: 12px; }

  /* ---------------- Variant A: Ağ vitrin ---------------- */
  .A { background: #fff; }
  .A .nav { background: rgba(245,245,247,.85); }
  .A .tile { background: #f5f5f7; padding-top: 52px; }
  .A .tile.w { background: #fff; }
  .A .hero h2 { font-size: 56px; }
  .A .hero p { font-size: 28px; }
  .A .big h2 { font-size: 48px; }
  .A .big p { font-size: 24px; }
  .A .grid .tile h2 { font-size: 40px; }
  .A .grid .tile p { font-size: 21px; }
  .A .tile .img { margin-top: auto; padding: 30px 0 0; width: 100%; display: flex; justify-content: center; }
  .A .tile .img img { mix-blend-mode: multiply; }
  .A .hero { min-height: 690px; }
  .A .hero .img img { height: 420px; object-fit: contain; }
  .A .big { min-height: 640px; }
  .A .big .img img { height: 380px; object-fit: contain; }
  .A .grid .tile { min-height: 580px; }
  .A .grid .tile .img img { height: 330px; object-fit: contain; }
  .A .grid .tile .img.photo img, .A .big .img.photo img { width: 86%; height: 340px; object-fit: cover; border-radius: 18px; mix-blend-mode: normal; margin-bottom: 40px; }
  .A .foot { background: #f5f5f7; color: #6e6e73; }

  /* ---------------- Variant B: Gecə ---------------- */
  .B { background: #000; color: #f5f5f7; }
  .B .nav { background: rgba(22,22,23,.85); color: #f5f5f7; }
  .B .nav img { filter: brightness(0) invert(1); }
  .B .tile { background: #000; color: #f5f5f7; padding-top: 52px; }
  .B .tile.g { background: #161617; }
  .B .hero { min-height: 720px; }
  .B .hero h2 { font-size: 56px; }
  .B .hero p, .B .big p { font-size: 26px; color: #a1a1a6; }
  .B .big { min-height: 660px; }
  .B .big h2 { font-size: 48px; }
  .B .grid .tile { min-height: 580px; }
  .B .grid .tile h2 { font-size: 40px; }
  .B .grid .tile p { font-size: 21px; color: #a1a1a6; }
  .B .tile .img { position: absolute; inset: auto 0 0 0; height: 62%; }
  .B .tile .img img { width: 100%; height: 100%; object-fit: cover; }
  .B .tile .img::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #000 0%, rgba(0,0,0,0) 40%); z-index: 1; }
  .B .tile.g .img::before { background: linear-gradient(180deg, #161617 0%, rgba(22,22,23,0) 40%); }
  .B .tile > :not(.img) { position: relative; z-index: 2; }
  .B .b2 { box-shadow: inset 0 0 0 1px #f5f5f7; color: #f5f5f7; }
  .B .b2:hover { background: #f5f5f7; color: #000; }
  .B .b1 { background: #a8323a; }
  .B .foot { background: #161617; color: #86868b; }

  /* ---------------- Variant C: Foto-plitə ---------------- */
  .C { background: #fff; }
  .C .nav { background: rgba(255,255,255,.85); }
  .C .tile { min-height: 620px; padding-top: 56px; color: #fff; }
  .C .tile > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
  .C .tile:hover > img { transform: scale(1.03); }
  .C .tile::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 42%); }
  .C .tile.light { color: #1d1d1f; }
  .C .tile.light::before { background: linear-gradient(180deg, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 42%); }
  .C .tile > :not(img) { position: relative; z-index: 2; }
  .C .hero { min-height: 760px; }
  .C .hero h2 { font-size: 60px; }
  .C .hero p { font-size: 28px; }
  .C .stack .tile h2 { font-size: 48px; }
  .C .stack .tile p { font-size: 24px; }
  .C .grid .tile { min-height: 560px; }
  .C .grid .tile h2 { font-size: 40px; }
  .C .grid .tile p { font-size: 21px; }
  .C .tile:not(.light) .b1 { background: #fff; color: #1d1d1f; }
  .C .tile:not(.light) .b2 { box-shadow: inset 0 0 0 1px #fff; color: #fff; }
  .C .tile:not(.light) .b2:hover { background: #fff; color: #1d1d1f; }
  .C .foot { background: #f5f5f7; color: #6e6e73; }

  .show { text-align: left; align-items: stretch; }
  .show .in { max-width: 980px; width: 100%; margin: 0 auto; padding: 70px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
  .show h2 { font-size: 44px !important; }
  .show p { font-size: 19px !important; opacity: .8; }
  .show .ctas { justify-content: flex-start; }
  .show dl { margin: 0; display: grid; gap: 14px; font-size: 17px; }
  .show dt { font-size: 13px; opacity: .6; }
  .show dd { margin: 2px 0 0; }

  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    .A .hero h2, .B .hero h2, .C .hero h2 { font-size: 40px; }
    .A .hero p, .B .hero p, .C .hero p { font-size: 21px; }
    .A .big h2, .B .big h2, .C .stack .tile h2 { font-size: 34px; }
    .show .in { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="picker">
  <span>Ana səhifə dizaynı:</span>
  <button data-v="A" class="on">A — Ağ vitrin</button>
  <button data-v="B">B — Gecə</button>
  <button data-v="C">C — Foto-plitə</button>
</div>
<p class="note" id="note"></p>

<div class="variant A on" id="A"></div>
<div class="variant B" id="B"></div>
<div class="variant C" id="C"></div>

<script>
var U = 'https://deluxekamin.com/wp-content/uploads/';
var LOGO = U + '2022/03/cropped-KAMIN-LOGO.png';
var NOTES = {
  A: '<b>A — Ağ vitrin.</b> Ağ və açıq boz plitələr, ağ fonlu məhsul fotoları fona qarışır. Klassik, təmiz, məhsul ön planda. Apple ana səhifəsinə ən yaxın variant.',
  B: '<b>B — Gecə.</b> Qara plitələr, alov fotoları qaranlıqdan çıxır. Kinematik və dramatik. Alovun özü ən güclü vizual olur.',
  C: '<b>C — Foto-plitə.</b> Hər plitə tam ölçülü interyer fotosudur, yazı fotonun üstündədir. Ən emosional, "ev" hissi verən variant.'
};

function ctas(a, b) {
  return '<div class="ctas"><a class="b b1" href="#">' + (a || 'Ətraflı') + '</a><a class="b b2" href="#">' + (b || 'Qiymət soruş') + '</a></div>';
}
function nav() {
  return '<div class="nav"><img src="' + LOGO + '" alt="Deluxe Kamin"><a>Kaminlər</a><a>Baca sistemləri</a><a>Radiator</a><a>Perila & Kovka</a><a>Mangal & Fırın</a><a>Haqqımızda</a></div>';
}
function showroom() {
  return '<div class="in"><div><h2>Kaminləri canlı görmək üçün gəlin</h2><p>Azadlıq prospekti 140/33, Gənclik. İş saatlarından kənar görüş də mümkündür.</p>' + ctas('Yol tarifi', 'WhatsApp') + '</div>' +
    '<dl><div><dt>Telefon</dt><dd>012 449 41 30 · 050 252 02 16</dd></div><div><dt>E-poçt</dt><dd>info@deluxekamin.com</dd></div><div><dt>Rəsmi distribütor</dt><dd>17 brend · Spartherm ixtisaslaşmış dileri</dd></div></dl></div>';
}
var FOOT = '<div class="foot">© 2004–2026 Deluxe Kamin &amp; Perila · Azadlıq pr. 140/33, Bakı</div>';

/* ---- A: Ağ vitrin ---- */
function tA(cls, title, sub, img, photo, c) {
  return '<div class="tile ' + cls + '"><h2>' + title + '</h2><p>' + sub + '</p>' + (c || ctas()) +
    '<div class="img' + (photo ? ' photo' : '') + '"><img src="' + U + img + '" alt=""></div></div>';
}
document.getElementById('A').innerHTML = nav() +
  '<div class="stack">' +
  tA('hero w', 'Majestic Echelon II', 'İki tərəfdən görünən qaz kamini.', '2022/05/Kamin-Majestic-Echelon-II.jpg') +
  tA('big', 'Italkero Mirror Flame', 'Güzgülü şüşənin arxasında canlı alov.', '2022/05/Kamin-Italkero-Mirror-Flame.jpg') +
  '</div><div class="grid">' +
  tA('w', 'Elektrik kaminlər', 'Baca lazım deyil. Rozetkaya qoşun.', '2026/01/Kamin-Dimplex-ignite-ultra.png', true, ctas('Modellər', 'Müqayisə et')) +
  tA('', 'Planika Panorama', 'Tüstüsüz bioetanol alovu.', '2022/09/Kamin-Planika-Panorama.jpg', false) +
  tA('', 'Odunlu kaminlər', 'Mərkəzi, asma, kaset.', '2022/05/Kamin-JC-Bordelet-ZELIA-908.jpg', true, ctas('Modellər', 'Qiymət soruş')) +
  tA('w', 'Bağ kaminləri', 'Terras və həyət üçün.', '2025/08/Kamin-Planika-Galio-Corten-4-scaled.jpg', true, ctas('Modellər', 'Qiymət soruş')) +
  '</div><div class="stack" style="padding-top:0">' +
  tA('big w', 'Schiedel Rondo Plus', 'Kaminlə birlikdə hesablanan keramik baca.', '2023/10/Schiedel-Rondo-Plus-Keramik-baca-sistemi-Deluxe.jpg', false, ctas('Baca sistemləri', 'Baxış sifariş et')) +
  '</div><div class="grid">' +
  tA('', 'Exodraft', 'Çəkiş zəifdirsə, baca fanı.', '2022/08/Exodraft-RSV-baca-fani.jpg', false, ctas('9 model', 'Qiymət soruş')) +
  tA('w', 'Mərmər portallar', 'Fərdi ölçüdə hazırlanır.', '2022/06/Mermer-Portal-London.jpg', true, ctas('Portallar', 'Qiymət soruş')) +
  '</div><div class="stack" style="padding-top:0"><div class="tile w show">' + showroom() + '</div></div>' + FOOT;

/* ---- B: Gecə ---- */
function tB(cls, title, sub, img, c) {
  return '<div class="tile ' + cls + '"><h2>' + title + '</h2><p>' + sub + '</p>' + (c || ctas()) +
    '<div class="img"><img src="' + U + img + '" alt=""></div></div>';
}
document.getElementById('B').innerHTML = nav() +
  '<div class="stack">' +
  tB('hero', 'Dimplex Cassette', 'Elektrik alov, real odun hissi.', '2025/12/Kamin-Dimplex-Cassette-scaled.jpg') +
  tB('big g', 'Arkiane Yan Li', 'Divarda heykəl kimi odunlu kamin.', '2022/05/Kamin-Arkiane-Yan-Li.jpg') +
  '</div><div class="grid">' +
  tB('', 'Spartherm DRU', 'Divara inteqrasiya olunan elektrik kamin.', '2026/01/Kamin-DRU-Virtuo-Evolve.jpg', ctas('Modellər', 'Qiymət soruş')) +
  tB('g', 'Arkiane Kephren', 'Otağın tam ortasında.', '2022/05/Kamin-Arkiane-Kephren.jpg', ctas('Modellər', 'Qiymət soruş')) +
  tB('g', 'Bağ kaminləri', 'Axşam bayırda bitməsin.', '2025/08/Kamin-Planika-Galio-Corten-4-scaled.jpg', ctas('Modellər', 'Qiymət soruş')) +
  tB('', 'Italkero Falo Evo', 'Qazla işləyən bağ kamini.', '2025/08/Kamin-Italkero-Falo-Evo-1-scaled.jpg', ctas('Ətraflı', 'Qiymət soruş')) +
  '</div><div class="stack" style="padding-top:0">' +
  tB('big', 'Baca sistemləri', 'Schiedel keramik və Poujoulat polad. Kaminlə birlikdə hesablanır.', '2022/06/Poujoulat-Therminox-celik-baca-sistemi.jpg', ctas('Baca sistemləri', 'Baxış sifariş et')) +
  '</div><div class="grid">' +
  tB('g', 'Planika Prime Fire', 'Bacasız bioetanol alovu.', '2026/01/Kamin-Planika-Prime-Fire-scaled.jpg', ctas('Ətraflı', 'Qiymət soruş')) +
  tB('', 'Mərmər portallar', 'Fərdi ölçüdə, daşdan.', '2022/05/Mermer-Portal-Roma.jpg', ctas('Portallar', 'Qiymət soruş')) +
  '</div><div class="stack" style="padding-top:0"><div class="tile g show">' + showroom() + '</div></div>' + FOOT;

/* ---- C: Foto-plitə ---- */
function tC(cls, title, sub, img, c) {
  return '<div class="tile ' + cls + '"><img src="' + U + img + '" alt=""><h2>' + title + '</h2><p>' + sub + '</p>' + (c || ctas()) + '</div>';
}
document.getElementById('C').innerHTML = nav() +
  '<div class="stack">' +
  tC('hero', 'Evin mərkəzi', 'Dünyanın 17 brendindən kaminlər və baca sistemləri. 1997-ci ildən.', '2026/01/Kamin-DRU-Virtuo-Evolve.jpg', ctas('Kaminlərə baxın', 'Showroom')) +
  tC('', 'Planika Galaxy', 'Həyət üçün bioetanol ocaq.', '2025/08/Kamin-Planika-Galaxy-Fireplace-main-scaled.jpg') +
  '</div><div class="grid">' +
  tC('light', 'JC Bordelet Zelia', 'Tavandan asılan kamin.', '2022/05/Kamin-JC-Bordelet-ZELIA-908.jpg', ctas('Ətraflı', 'Qiymət soruş')) +
  tC('', 'Dimplex Vista', 'Ailə ilə axşamlar üçün.', '2026/01/Kamin-Dimplex-Vista-3.png', ctas('Ətraflı', 'Qiymət soruş')) +
  tC('', 'Arkiane Kephren', 'Döşəmədə, otağın ortasında.', '2022/05/Kamin-Arkiane-Kephren.jpg', ctas('Ətraflı', 'Qiymət soruş')) +
  tC('', 'Italkero Falo Evo', 'Terras üçün qaz kamini.', '2025/08/Kamin-Italkero-Falo-Evo-1-scaled.jpg', ctas('Ətraflı', 'Qiymət soruş')) +
  '</div><div class="stack" style="padding-top:0">' +
  tC('light', 'Baca sistemləri', 'Kaminlə birlikdə hesablanır, bizim komanda quraşdırır.', '2023/10/Schiedel-Rondo-Plus-baca-sistemi.jpg', ctas('Baca sistemləri', 'Baxış sifariş et')) +
  '</div><div class="grid">' +
  tC('light', 'Mərmər portallar', 'Fərdi ölçüdə hazırlanır.', '2022/06/Mermer-Portal-London.jpg', ctas('Portallar', 'Qiymət soruş')) +
  tC('', 'Dimplex Cassette', 'Elektrik alov, real odun hissi.', '2025/12/Kamin-Dimplex-Cassette-scaled.jpg', ctas('Ətraflı', 'Qiymət soruş')) +
  '</div><div class="stack" style="padding-top:0"><div class="tile light show" style="background:#f5f5f7;color:#1d1d1f;min-height:0">' + showroom() + '</div></div>' + FOOT;

/* seçim */
var note = document.getElementById('note');
function pick(v) {
  document.querySelectorAll('.variant').forEach(function (el) { el.classList.toggle('on', el.id === v); });
  document.querySelectorAll('.picker button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); });
  note.innerHTML = NOTES[v];
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
  window.scrollTo(0, 0);
}
document.querySelector('.picker').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) pick(b.dataset.v); });
document.querySelectorAll('.tile').forEach(function (t) { t.addEventListener('click', function (e) { e.preventDefault(); }); });
pick(/^#[ABC]$/.test(location.hash) ? location.hash.slice(1) : 'A');
</script>
</body>
</html>
